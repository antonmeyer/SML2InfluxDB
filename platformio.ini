; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
; Versions are pinned to what was built and tested (2026-10), so that a library or platform update does not
; break the build unnoticed. libsml: the commit of 1.1.4 (device) - the host tests (env:native) use the same one.
; jled was listed but is not used by the code.
lib_deps = 
	git+https://github.com/volkszaehler/libsml#9ff113e448efd1b14f871e556ce189a797032447
env_default = DoIT_ESP32_v1
build_flags = -DIOTWEBCONF_PASSWORD_LEN=65
lib_ldf_mode = deep+

[env:esp32doit-devkit-v1]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
lib_deps = 
	${common.lib_deps}
	;me-no-dev/AsyncTCP@^1.1.1
	;me-no-dev/AsyncTCP
	tobiasschuerg/ESP8266 Influxdb@3.13.2
	prampec/IotWebConf@3.2.1
	
lib_ldf_mode = ${common.lib_ldf_mode}
; INFLUX_DRY_RUN=1: nothing is sent to the database, the line protocol is only printed on the serial console.
; Set it to 0 for real operation. Use a different INFLUX_MEASUREMENT for tests, so that the data can be deleted again.
build_flags = ${common.build_flags} -DSERIAL_DEBUG=false -DINFLUX_DRY_RUN=1 -DINFLUX_MEASUREMENT=\"ePower_test\" -DINFLUX_MEASUREMENT_ESP=\"ESP32_test\"
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-0001

upload_port = /dev/cu.usbserial-0001
;upload_protocol = espota
;upload_port = esp32VH

board_build.partitions = min_spiffs.csv

; Regression tests of the SML decoder on the host with captures of real meters: pio test -e native
[env:native]
platform = native
test_framework = unity
lib_deps = git+https://github.com/volkszaehler/libsml#9ff113e448efd1b14f871e556ce189a797032447
lib_compat_mode = off
build_flags = -Isrc -Itools/selftest -Itools/pi -DSML_NO_UUID_LIB -DUNITY_INCLUDE_DOUBLE -std=gnu++11 -Wall

; Hardware self test of the UART receive path on one ESP32 with internal loopback (no external hardware):
;   pio run -e selftest -t upload --upload-port <port> && pio device monitor -e selftest -p <port>
; The frames come from the captures: python3 test/tools/make_replay.py
[env:selftest]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
build_src_filter = -<*> +<../tools/selftest/selftest.cpp>
lib_deps = git+https://github.com/volkszaehler/libsml#9ff113e448efd1b14f871e556ce189a797032447
build_flags = -Isrc -Itools/selftest -DSML_NO_UUID_LIB ; add -DSML_TRACE=1 to see every UART event
lib_ldf_mode = off
monitor_speed = 115200

; ESP32-S3 N16R8 (16 MB quad flash, 8 MB octal PSRAM), serial console on the native USB port.
; GPIO 26..37 are used by flash/PSRAM, 19/20 by USB: RX of the meters on GPIO4 and GPIO5, config pin GPIO7.
; Do not let this board take firmware from the OTAdrive product of the ESP32 (wrong chip): OTA off until it has an own one.
[env:esp32-s3-n16r8]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
lib_deps = 
	${common.lib_deps}
	tobiasschuerg/ESP8266 Influxdb@3.13.2
	prampec/IotWebConf@3.2.1
lib_ldf_mode = ${common.lib_ldf_mode}
build_flags = ${common.build_flags} -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -DMETER1_RX_PIN=GPIO_NUM_4 -DMETER2_RX_PIN=GPIO_NUM_5 -DCONFIG_PIN=GPIO_NUM_7 -DINFLUX_DRY_RUN=1 -DINFLUX_MEASUREMENT=\"ePower_test\" -DINFLUX_MEASUREMENT_ESP=\"ESP32_test\" -DOTA_CHECK_INTERVAL_MS=0
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem1101
upload_port = /dev/cu.usbmodem1101

; UART self test on the S3 (internal loopback, GPIO16 is free here)
[env:selftest-s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_src_filter = -<*> +<../tools/selftest/selftest.cpp>
lib_deps = git+https://github.com/volkszaehler/libsml#9ff113e448efd1b14f871e556ce189a797032447
build_flags = -Isrc -Itools/selftest -DSML_NO_UUID_LIB -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1
lib_ldf_mode = off
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem1101
upload_port = /dev/cu.usbmodem1101
